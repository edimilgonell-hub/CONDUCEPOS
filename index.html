    <!-- Safe fetch getter/setter shim to prevent window.fetch getter-only TypeError -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return activeFetch; },
            set: function(val) { activeFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var winProto = Object.getPrototypeOf(window);
            if (winProto && Object.getOwnPropertyDescriptor(winProto, 'fetch')) {
              var desc = Object.getOwnPropertyDescriptor(winProto, 'fetch');
              Object.defineProperty(winProto, 'fetch', {
                get: desc.get,
                set: function(v) {},
                configurable: true
              });
            }
          } catch (e2) {}
        }
      })();
